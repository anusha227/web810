<!DOCTYPE html>
<html>
    <head>
        <title>Attribute Example</title>
        <meta charset="UTF-16"/>
        <style>
            #demo{
                color:tomato;
                
                font-weight: 900;
                font-size: large;
            }
            #dve{
                height: 170px;
                object-fit: cover;
            }
        </style>
    </head>
    <body>
        <!---Global attribute-->
        <h1 id="demo">Welcome</h1>
        <img id="dve" target="_blank" src="img.png"> 
        <br/>
        <!---predefined attribute-->
        <a href="https://google.com">Googe</a>
        <!---Boolean attribute-->
        <ol reversed style="color: rgb(244, 6, 244);">
            <li>January</li>
            <li>Feburary</li>
            <li>March</li>
            <li>April</li>
        </ol>
       
    </body>
</html>
